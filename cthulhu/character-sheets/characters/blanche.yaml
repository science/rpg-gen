# --- Keeper notes (not for the player sheet) ---
keeper_notes:
  stats_reconciliation: >
    Electrical Repair 40 and Mechanical Repair 40 are the séance trade: hidden
    wires, rapping devices, a bell that rings on cue, a table that lifts. She
    is the party member who can tell whether a room has been rigged. Sanity 50
    is ten below her POW of 60 — she has already lost something to "the
    remainder," whether or not she admits it. MP shows 12 maximum, 10 current.
    Science (Astronomy) 23 is a medium's horoscope knowledge.
  table_convention: >
    Per the Keeper's standing rule: racism exists in this 1921 world but stays
    OFF-STAGE. If the Franco-American background is used, it is texture and
    strength, never a wound the table pokes at. Mercure's male stage persona is
    the player's to control and is never used as a plot threat or exposure
    risk unless that player opts in.
  hooks:
    - "The remainder: she has always half-wondered about the nights the room answered back. In Shadows over Providence it answers clearly — at the meet-and-greet, and then at the séance, where Bronson speaks through the vent and possibly through Blanche herself."
    - "Mrs. Carruthers is the standing pressure. She can turn up anywhere society gathers (in Providence: her sister lives there), vouch for Blanche, demand her attention, or make a jealous scene in front of the wrong people."
    - "The client notebook is a liability waiting to happen: if it is lost or stolen, a dozen Beacon Hill secrets are in someone else's hands, with her name on them."
    - "Mercure has exposed mediums for a living, and Mercure's rival Cornelius Vane is a Boston medium with wealthy clients. Blanche may know Vane's act — or be useful against him. Keep the professional friction with Mercure collegial unless the players push."
    - "Belief is the binding prayer's price. The fraud who has heard a real voice may be the one person in the party who can mean the words."
  suggested_skills_flavor: ["Charm", "Sleight of Hand", "Occult", "Psychology", "Spot Hidden", "Library Use", "History", "Electrical Repair", "Mechanical Repair"]
  note: "Credit Rating, Brawl and wealth are copied from the attribute sheet; all other numbers stay on that sheet."
