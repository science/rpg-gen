injuries_scars:
  - name: "Bullet wound, right shoulder"
    desc: "A Turkish machine-gun round at the Third Battle of Gaza, November 1917, followed by a winter of fever in a Cairo hospital. The entry and exit scars are ugly; the arm never got its strength back, and he tires faster than he did before the war."
  - name: "Gallipoli"
    desc: "No scar to show for Suvla Bay, only a dislike of crowded beaches, flies, and the smell of cordite in the sun."

# --- Keeper notes (not for the player sheet) ---
keeper_notes:
  table_convention: >
    Per the Keeper's standing rule: racism exists in this 1921 world but stays
    OFF-STAGE. Owen's service in Egypt and Palestine is written as a soldier's
    hard experience and respect for the places and people, never as colonial
    adventure. Separately: Mercure's male stage persona is the player's to
    control. Owen (and every NPC) takes "Monsieur Mercure" at face value; the
    persona is never used as a plot threat or exposure risk unless the player
    opts in.
  stats_reconciliation: >
    Backstory matched to the attribute page. STR 35 is the war's lasting cost
    (the Gaza shoulder wound plus fever); CON 50 and HP 10 are ordinary.
    Firearms (Rifle/Shotgun) 50 is country shooting plus the infantry; Brawl
    50, Dodge 50, First Aid 50 and Psychology 40 are the front line. He has
    no Arabic and no Navigate, so he was not a liaison officer or surveyor.
    Occult 27 is his grandmother's stories. Sanity 55 (= POW, unreduced):
    the war hurt him without breaking him.
  play_modes: >
    PLAYABLE: hand the player this sheet plus the Southampton secret, and let
    them decide when (or whether) to confess it. NPC MODE: if the player does
    not return, the Keeper runs Owen as the party's guilt-driven guide — he
    volunteers the ledger, the keys, room 808, and the library, and asks the
    party for help because the police will not listen to a foreigner talking
    about curses. In a fight he is a steady shotgun and a field medic.
  exit_options:
    - "Send him to Brown's John Hay Library with Margaret Pemberton to dig out the other copy of his grandmother's monograph — he leaves the table but his research arrives later as a handout."
    - "The creature takes him in the night (he went back to the ballroom alone to collect fragments). He becomes one of the voices in the vents — calling the party by name, confessing Southampton through the grille."
  hooks:
    - "The Southampton secret is the engine: he loosened the binding (or believes he did). Confession to the party, to Drummond, or to Pemberton is a dramatic beat the player controls; exposure by Fanshawe's cable is the Keeper's lever if he sits on it too long."
    - "Grandmother's shabti makes its bearer invisible to the creature — the party may already own its best defence without knowing it. Reveal when someone researches the 1879 incident or when the creature visibly fails to see him."
    - "He is a living clue index: the ledger (what was taken, where pieces fell), the case keys, Bronson's room key, and the name of the 1903 monograph all route the party to the right nodes without a die roll."
    - "Fanshawe's cable creates institutional pressure: the Museum wants the remaining collection crated and shipped, and Owen ordered off the case — a mundane clock that competes with the monster's."
    - "Old soldiers recognise him: Hannigan or Drummond may have served in France, and the regimental tie-pin opens a conversation the Mayor's letter can't."
    - "The 1903 monograph contains the binding procedure in Elisabeth's dry academic prose. Owen's own copy is in London; Brown's John Hay Library has the other known copy (Thread A). He knows the title, which gives a bonus die to finding it."
    - "His dreams of moving sand at Gaza are the creature's way in: Ibnhotep can use them in the finale's psychic assault."
  suggested_skills_flavor: ["History", "Library Use", "Language (Egyptian — hieroglyphic & hieratic)", "Appraise", "Archaeology", "Firearms (Rifle/Shotgun)", "First Aid", "Fighting (Brawl)", "Spot Hidden", "Charm", "Psychology", "Occult"]
  note: "Credit Rating, weapon skills and wealth figures are copied from the attribute page; no other numbers are invented here."
