    - item: "Conservation kit in a leather case"
      desc: "Soft brushes, cotton wool, tweezers, acid-free tissue, labels, a bottle of shellac, and small brass scales. Meant for loose labels, flaking glaze, and the small repairs a touring collection always needs."
    - item: "Folding pocket camera (Vest Pocket Kodak)"
      desc: "For condition photographs. Takes clear record shots in daylight; useless indoors at night."
    - item: "Electric torch"
      desc: "A Museum-issue flashlight for crate inspections, with a spare battery."

