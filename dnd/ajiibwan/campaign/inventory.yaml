# inventory.yaml — live party loot tracker for the game-2 run.
#
# Two pools:
#   strongbox: shared, fungible/general loot. Visible to the whole table; any PC can pull
#     from it in the fiction without a scene about who "gets" it. This is where sellable
#     junk, stacks of resources, and not-yet-claimed curiosities live.
#   assigned:  items that need CLEAR individual possession — usable gear a PC is actively
#     wielding/wearing, unique magic items, anything where "who has it" matters mechanically
#     or dramatically (e.g. a wildcard NPC could steal it back). Give these an owner.
#
# Update after each session (methodology step 7, alongside sessions/NN.md).

strongbox:
  - item: "White-metal spider bracelet"
    source: "Taken off Jeffrol when he and his mercenaries emerged from the Kantaroz tower, session 3"
    note: >
      Unidentified by the party — old-school rule, no reveal from attuning alone (see
      lore-and-mysteries.md → item identification convention). GM-ONLY TRUTH (ref
      item:spider-bracelets, thread:sea-of-souls-water): a Bokkaran ward against the Sea of
      Souls' unseen water — specifically it prevents the wearer succumbing to sleep while
      in the Sea of Souls. Payoff held for when the party reaches the Sea of Souls arc.
      ALSO (campaign rule, Steve): it HALVES the damage a Bokkaran language engine deals to its
      wearer. One use per bracelet per engine — the party can trade it between characters, but a
      given bracelet protects only one character at a given engine. It works again at the next
      engine. Engines so far: the Keeper's (9p, Sia) and Yormon's (Sea of Souls, Bridged City arc).
      USED AT: (none yet)
  - item: "Bokkaran scrolls — Mending, Encode Thoughts, Alarm"
    source: "Jeffrol's mercenary camp, session 3"
    note: >
      Unusable until someone can read Bokkaran, which only a spirit's or god's grant, or a language
      engine, can give. Tsendur can say roughly what each scroll is about but cannot cast them
      without long study, and copying one to a spellbook is further off. All three are deep magic
      (Wizard spells), so casting one triggers magical consequences unless the caster has a
      Bokkaran charm or the anti-miscast cantrip. See state.yaml -> canon.
  - item: "Herbs & alchemical resources"
    source: "Jeffrol's mercenary camp, session 3"
    note: "Raw materials — not consumables in hand yet."
  - item: "Black obsidian serpent ring"
    source: "Off the petrified Black Water cultist ('the new statue') in the Tomb of the Sphinx, session 5"
    note: >
      The Black Water Cult's standard membership token. Useful for passing as cult staff at a cult
      operation (e.g. the Temple of Mennuj at Ayatorrah). Move to `assigned` if a PC starts wearing
      it. Its twin is still on the half-absorbed miner in 9j.
  - item: "Coin — 52 gp"
    source: "Session 6, Tel A'bib: the merchants' collection plate at Elmingwed's banquet, plus selling old equipment"
    note: "The party's whole purse. Split it between PCs if the table wants per-character coin."
  # SOLD (session 6, Tel A'bib): broken swords, torn armor, misc. equipment from Jeffrol's camp (~12 gp).

assigned:
  - item: "Studded leather armor"
    owner: "Ren"
    source: "Gift from Elmingwed, Tel A'bib, session 6"
  - item: "Studded leather armor"
    owner: "Lia"
    source: "Gift from Elmingwed, Tel A'bib, session 6"

# --- Not items, but they travel with the party --------------------------
companions:
