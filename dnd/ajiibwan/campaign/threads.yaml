# threads.yaml — live plot threads for the game-2 run.
#
# status: dormant | active | advancing | resolved
# autonomous: what the thread/faction does ON ITS OWN each world tick if the party
#   ignores it (dnd/CLAUDE.md principle 2 — the world doesn't care about the party).
#   The world clock (state.yaml) ticks these between sessions regardless of action.

threads:

  - id: thread:jeff-fate
    title: "What to do with Jeff"
    status: resolved     # session 4 — deployed, not handed over, not killed
    summary: >
      RESOLVED at Elmingwed's compound, session 4. Elmingwed had no coin to collect (Jeff's
      stolen operating money was already sunk in a speculative camel venture), so he converted
      the debt into labor: Jeffrol was sent up the NORTHERN TRADE ROAD toward the Granite
      Empire to personally shepherd that venture and make sure Elmingwed's share pays out.
      He is due back in ~9 WEEKS. He leaves alive, useful, and owing — the outcome most likely
      to bring him back as a complication rather than a corpse.
    consequences:
      - "The party never had to decide whether to kill him; the pressure came off without the bind going away."
      - "Orkideh's leash is loosened, not cut — see thread:orkideh-secret. He returns."
      - "Follow-on arc opened: thread:jeffrol-hothme."
    autonomous:
      - "Nine weeks of unsupervised road. He makes contacts, he makes money, and he makes himself useful to people who are not Elmingwed."

  - id: thread:orkideh-secret
    title: "Orkideh & Jeff's fraud against the Vanic Navy"
    status: active     # Jeff already talked in session 3 — the bind is live at the table now
    summary: >
      Orkideh and Jeff ran a sisal/jute-for-abacA fiber-substitution scam: sell cheap
      fiber as premium maritime cable/hawser to the Vanic Imperial Navy and be long gone
      before the rope rotted in salt water. The partnership collapsed in mutual betrayal:
      Jeff says Orkideh was about to have him murdered and keep the profits; Orkideh says
      Jeff ran off with the seed money and wrecked the venture. (GM truth: Jeff DID take
      the assets, and will never admit it.) Neither can run to the law — both conspired to
      defraud the Empire itself.
    leverage: "A classic 'no, YOU'RE the criminal' bind that should give Orkideh's player real pause; the world can push back on her here."
    contingency: >
      Jeff's dead-man's deposit (see scenarios/the-tinkerers-strings.md). A packet of fraud
      documents sits with an unnamed Tel A'bib merchant; if Jeff doesn't return by a set
      time it goes to the Boetharch of Tel A'bib ([[npc:boetharch]]). The papers implicate
      Elmingwed too — but he's untouchable (weekly lunch with the Boetharch). The real
      target is Orkideh, especially once the Boetharch knows she's in the area.
      SESSION 4 DEVELOPMENT (scenarios/elmingweds-web.md): with Jeff now delivered to his
      own doorstep, Elmingwed is positioned to lean on "no lower merchant crosses me" and
      simply collect the packet himself — GM's call whether he already has it (leverage
      lands immediately) or is one step from getting it (a last window for the party to
      intervene). Either way this converts thread:jeff-fate's cash payoff into a service
      obligation, since Jeff's actual coin is tied up (see thread:jeff-fate).
    autonomous:
      - "Jeff will use it as currency — revealing it to the party to drive a wedge and buy his life — but will never name the merchant holding the packet."
      - "If the deposit ever reaches the Boetharch, an investigation/warrant simmers toward Orkideh over the following weeks; a future Tel A'bib visit gets dangerous for her."

  - id: thread:kantaron-summoning
    title: "The demon being grown at Kantaroz"
    status: advancing   # the central ouija-board clock of this session
    ref: "[[creature:nalfeshnee]]"
    summary: >
      In the Kantaroz basement lab a Balor (named Nalfeshnee) is being SUMMONED — its
      spirit drawn from another plane while a body is 'grown' for it, powered by the
      tower's Bokkaran water/leyline engine. Durel, the tower's artificer-magician, has
      fallen under its mental control and tends the work, believing he is recovering
      Bokkaran secrets. It is INCOMPLETE and stoppable now.
    note: "Disrupting it has NO downstream cost at this scale — the only price is a hard fight. DELAY is the danger: dithering because the fight is hard is what lets it grow."
    autonomous:
      - "Every stretch of lollygagging advances the summoning. If the party never intervenes (or fails), the body completes: a full Balor lairs at Kantaron, enslaves/discards Durel, and threatens Tel A'bib (prior-run precedent)."
      - "Constructs continue stripping resources from the foothills under Durel's control."

  - id: thread:sea-of-souls-water
    title: "Kantaroz feeds the Sea of Souls (seed only)"
    status: dormant
    ref: "[[item:spider-bracelets]]"
    summary: >
      The Kantaroz basement is a wellhead of the unseen water that fills the distant Sea
      of Souls (Bokkaran leyline tech draining to a facility near Tel A'bib). FLAVOR/MYSTERY
      only for now — no mechanical consequence yet; it's a seed for a later Sea-of-Souls arc.
      The party already holds one **spider bracelet** (session 3, off Jeffrol — see
      campaign/inventory.yaml), unidentified. GM-ONLY TRUTH: it wards against the Sea of
      Souls' unseen water, specifically preventing the wearer from succumbing to sleep
      there. Save the reveal for when the party actually reaches the Sea of Souls.
      Also halves language-engine damage, one wearer per bracelet per engine (see
      thread:the-keeper -> reward); that half of its truth can surface at Sia.
    accumulating_kit: >
      The party is quietly assembling a Sea-of-Souls expedition kit without knowing the place
      exists. (1) The white-metal spider bracelet, session 3, unidentified — wards against the
      unseen water, prevents the wearer succumbing to sleep there. (2) A B'rath **Fire Beetle
      Lantern** ([[item:fire-beetle-lantern]]), recoverable from the cult dead in the Tomb of
      the Sphinx — smokeless, needs no air, burns about a week per tank; the standard light for
      working beneath the Sea of Souls, where an ordinary flame is useless AND an advertisement.
      Do not connect these for the party. The moment they finally stand at the Sea of Souls and
      realize they have been carrying the right gear for two adventures is worth more than any
      reveal you could hand them.
    slow_seed: >
      The lantern's brass foot is etched with five marks joined by roads and labelled in a
      script nobody can read: the five Holy Cities. Unexplained, unremarked, and not connected
      to this thread at all until the party sees the shape somewhere real.
    autonomous:
      - "Inert for now. The connection only matters once the party engages the Sea of Souls in a future adventure."

  - id: thread:elmingwed-deal
    title: "Elmingwed's patronage"
    status: advancing     # session 4 — warm, and the party bought in deeper than he asked
    ref: "[[npc:elmingwed]]"
    summary: >
      Elmingwed — powerful by wealth and connections, not by levels — pre-bought half of
      Jeff's value sight-unseen and hired Jiyloo to deliver the party. Jeff arrived with
      empty pockets, so in session 4 Elmingwed converted the debt into service and offered a
      fork: take a fee to carry a message to [[npc:tsendur]] at [[loc:durgans-rest]], or take
      NO fee and reopen the choked trade route at the [[loc:oasis-of-sia]], putting Elmingwed
      and the merchants of Tel A'bib in the party's debt instead.
      **The party chose reputation over gold** and took the Sia job unpaid. They also still
      carry the Tsendur letter (thread:tsendur-letter) — they took the harder job without
      giving the other one back.
    after_sia: >
      (Steve, after session 5.) The party WILL bring him the captive monk; that is treasure to him
      on its own. Restoring the transit lane is the main thing. Leaving the tomb's treasure in place
      reads to him as smart, seeing the bigger picture. He does NOT write to the Bridged City;
      introductions there are Tsendur's (to Dain Ironheart). Negotiation:
      scenarios/mishap-at-durgans-rest.md -> "The audience with Elmingwed".
    standing: >
      Warm and rising. If Sia is actually reopened, Elmingwed owes them publicly and so do
      Feltan, Al-Esellin and the western-route merchants — a reputation asset the party can
      spend, which is what they were angling for. It is also a debt with no receipt: make
      them work a little to cash it, or the choice costs nothing.
    autonomous:
      - "Elmingwed's interests (and his militia captain, [[npc:abet]]) keep moving regardless."
      - "If the party fails or abandons Sia, he does not rage — he simply commissions someone else and the debt never forms. That is the real cost of the unpaid gamble."

  - id: thread:tathshar-maghiel
    title: "Tath'Shar's search for their sister"
    status: active      # session 4 — Tath'Shar debuted and named Maghiel at the table
    ref: "[[npc:maghiel]]"
    summary: >
      Tath'Shar (PC, debuted session 4; they/them — gender-neutral, trans, NEVER she/her) is
      a Drow noble who received from Elmingwed a letter for [[npc:tsendur]] at
      [[loc:durgans-rest]] — not a courtesy note: it warns Tsendur that a drow wizard is
      hunting "prohibited artifacts." Their real purpose: they believe their sister Maghiel
      (she/her) is active in the region and want to find and stop her before she goes further
      down that path. Session 4: they voiced this, argued for going to Tsendur first, lost the
      vote to the Oasis of Sia, and accepted it without a fight. The letter is still in their
      pocket (thread:tsendur-letter).
      CORRECTED WORLD-TRUTH for this reset run (overrides world/entities.yaml's
      prior-campaign "already Black-Thorn-cursed" status — see dnd/CLAUDE.md principle 1):
      **Maghiel is NOT yet cursed.** She becomes so only after the events of
      scenarios/mishap-at-durgans-rest.md, where she steals the Clasp of Vergren from Tsendur
      (unknowingly a sealed Black Thorn splinter) and is pierced by it studying the theft
      off-screen. The party's own letter may be what puts her on Durgan's Rest's map —
      deliberately ambiguous, but real complicity, not just Tath'Shar's personal stake.
      NOT to be revealed to the party outright until that session plays out.
    crew_rule: >
      Campaign-long convention (Steve): Maghiel is always ahead of the party in level and very hard
      to beat; she always gets away. Her named crew (Gotrin, Tolovin, Kyorgar) stay at or near the
      party's level, so those fights are fair. When losing, she often teleports out WITH whichever
      crew members are standing near her; anyone downed, grappled or cut off stays and can be
      captured (the game-1 party did). Every encounter also brings red shirts: drow mercenaries.
    the_bind: >
      Tath'Shar wants to save their sister. Delivering the letter is what damns her. They do
      not know that and must not be told. Meanwhile the delay is its own answer — see
      thread:tsendur-letter.
    autonomous:
      - "Advances hard the moment the party reaches Durgan's Rest — see scenarios/mishap-at-durgans-rest.md for the scripted outcome (Maghiel must escape with the Clasp)."
      - "While the party is at Sia, Maghiel is doing her own work somewhere. Rumor, not presence."

