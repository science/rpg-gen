  - id: thread:tsendur-letter
    title: "The undelivered letter to Tsendur"
    status: active
    ref: "[[npc:tsendur]]"
    summary: >
      Elmingwed's sealed letter for Tsendur at [[loc:durgans-rest]] is in Tath'Shar's hands,
      carried and UNDELIVERED as of session 4. The party has not read it and knows only that
      they were asked to carry it. Its real content warns Tsendur that a drow wizard is
      hunting prohibited artifacts and to guard anything of that description — i.e. it tells
      Tsendur to protect the Clasp of Vergren.
    the_crux: >
      Delivering it is the act that plausibly puts Maghiel on Durgan's Rest's map, and
      Tath'Shar is the courier. See thread:tathshar-maghiel and
      scenarios/mishap-at-durgans-rest.md. Do not surface the irony until it lands.
    autonomous:
      - "DECIDED (after session 5): the delay neither helps nor hurts Tsendur. Maghiel is following the COURIER, not hunting Tsendur — she wants to know what the sealed letters say — so the raid comes the night the letter is delivered, whenever that is. She has been shadowing the party all along, Sia included. Show it once on the mountain road (scenarios/mishap-at-durgans-rest.md -> Coming here from Sia)."
      - "Elmingwed will eventually notice it was never delivered. That is a small, real cost to the patronage in thread:elmingwed-deal."

  - id: thread:missing-caravans
    title: "The choked western route"
    status: active     # the party is on it as of session 4
    ref: "[[loc:oasis-of-sia]]"
    summary: >
      Caravans on the western route stopped arriving. The cause is the Black Water Cult raid
      on the Oasis of Sia: the oasis sacked, its people killed or taken as slaves, the water
      fouled, and the site held while the cult digs for what is under the sphinx. Feltan has
      a standing reward out for an answer; the party took Elmingwed's version of the job
      instead, and took it unpaid (thread:elmingwed-deal).
    open_at_the_table:
      - "Afara Al-Doorne and her daughter Dasara are ALIVE in a covered hole near the pond and have not been found. Abd Al-Doorne was killed getting them hidden (Elven Goods, area 5). Distinct from the El-Alouph family below."
      - "The slaves taken by the raiders were led into the desert days ago — INCLUDING the El-Alouph family of the wagon shop, whose dog Orkideh now has. Per the source the dog will lead the party on its family's trail, which makes it a live lead on the slave caravan. Nobody at the table has mentioned the slaves yet. This is the part of the job that is not about gold."
    session_6_option: >
      If the party takes the Keeper's errand north (thread:the-keeper), the dog can pick up the
      El-Alouph family's trail on the old stone road to Ayatorrah, forking from it at the first
      pair of obelisks (the "Turnings of Fate", six miles out). Optional — a fork in the
      adventure, not only the road.
    autonomous:
      - "If the party clears the site and leaves, the route reopens slowly on its own — traders test it, word spreads, the reputation payoff arrives late but real."
      - "If the party dies or withdraws, the Black Water Cult finishes its excavation and the western route stays shut. Feltan's reward goes to someone else eventually."

  - id: thread:sia-tomb
    title: "The Tomb of the Sphinx"
    status: active
    ref: "[[subloc:sphinx-sia]]"
    summary: >
      Session 5 was a full crawl: the party explored nearly every room, learned the door
      grammar and used it (marked cells left shut), and slammed 9f shut on An-Zefful. They
      ended at the hidden door between the two armoured statues, which opens into 9o (the
      False Treasure Room); 9p, Sia's tomb, is beyond it. Above ground the oasis is clear of
      living cultists but for one captive.
    ashiq_lore: >
      DECIDED after session 5: Ashiq heads the Black Water Cult. She and the other top ranks
      WOULD say the four names if it made life easier, but can never be seen doing it — one
      overheard prayer to Doorne and they look mortal and craven, and the fanatics' devotion
      collapses on them. The cult they built traps them into performing purity to Elsrok. Hence
      the drowned priest (a puppet's mouth is doctrinally clean). At the table: alone she bargains
      and might say the names; in front of one fanatic she dies first; a credible rumour that she
      prayed to Doorne is a weapon. scenarios/ashes-at-the-sphinx.md -> Rule one, "Would Ashiq
      say the words?".
    after_the_tomb: >
      Two roads out: north on the Keeper's errands (Forsaken Pyramid), or Tel A'bib then Durgan's
      Rest (expected — the party promised Tath'Shar). What happens at Sia behind them depends on
      whether they relit the Ember and buried the murdered priest. scenarios/ashes-at-the-sphinx.md
      -> "After the tomb — which way?".
    session_6_opening: >
      At the hidden door into 9o. Prep in scenarios/ashes-at-the-sphinx.md -> "Session 6 opens
      here": the grammar as a search aid for both hidden doors; five options for 9o (the plank
      crossing over the pit; Tabbat, a cultist stranded eight days on the ledge who will not say
      the names; the high priest Kamenhet painted at the king's shoulder where the god should be,
      his name under the scraped gold leaf, and a last panel showing him sealing himself in; the
      Keeper speaking through the door before it opens; and Ashiq's column arriving so that the
      wight's room becomes the only sanctuary). Then the Keeper — see thread:the-keeper.
    session_5_opening: >
      The party is mid-fight with the Giant Ants (9b). DESIGNED WAY OUT (not mandatory —
      fighting is fully supported): Jiyloo realises the problem is their dirty feet, slams and
      braces the door herself, and sends the party back to 9a's pools to wash — including
      carrying water back and kneeling to wash HERS, since she can't let go. The ants settle in
      stages as each person comes clean, then go still. This reframes 9b: the ants were never
      checking credentials, they were attacking a TRESPASS (dirty feet + a door marked "no
      passage"), and removing the trespass removes the reason. Afterwards the party can enter
      9b safely to recover the dead cultist and his route-sketch — but prying fittings or floor
      gold wakes all twelve, which is the free, survivable lesson in rite 4, "Depart holy."
      Then 9a is re-read as the VESTIBULE it always was, and all five rites are found in
      it. See scenarios/ashes-at-the-sphinx.md -> "Session 5 opens here".
    the_real_clock: >
      From the session-4 interrogation, earned not narrated: the cult's MAIN BODY left ~a
      week ago to fetch MAGICAL ITEMS NEEDED TO PENETRATE THE TOMB, and is due back within
      1-2 DAYS. Two things follow, and both are gifts. (1) There is something down there the
      cult could not get past — and as of session 4 it is NAMED: the tomb's two
      credential-checking guardians. The Caryatid Columns in 9a are UNDYING (the cult knocked
      them down and they got back up, every crossing costing bodies for nothing), and the Stone
      Guardian in 9e is functionally immune to how the cult fights — quarter damage from edged
      weapons, zero from missiles, immune to mind control. The safe phrase that opens it
      requires praising Doorne, which Elsrok-sworn fanatics will not do. The door was open the
      whole time; they went shopping instead. Jiyloo walked the party past the first of those
      two by drawing her pendant and saying so out loud.
      (2) The cult is returning with the means to get past it. This replaces the source
      module's flat 24-hour patrol clock; it is shorter, it is the party's own information,
      and it tells them what the fight at the end will be about.
    house_rule_in_effect: >
      DOORNE'S RULES (scenarios/ashes-at-the-sphinx.md -> "Doorne's rules at the table").
      Rule one, the PENDANT: an openly displayed pyramid satisfies 9a's Caryatid Columns;
      spoken praise satisfies 9e's Stone Guardian. Those are the only two credential-checking
      guardians in sixteen rooms. Rule two, the BLESSING: offered in 9A (the vestibule), right
      after the ant scene. Each PC individually kneels in one of 9a's four doorframes and says
      "I take the goodness of Doorne into my heart." The door chosen sets a boon for the whole
      delve, keyed to the god's four names: EAST/Creator = no food or water needed + advantage
      on saves vs poison and disease; WEST/All-Knowing = advantage on Investigation, History and
      Religion here + the Rule-three door-marks read as plain language; NORTH/Mighty = carried
      gear weighs half + advantage on Athletics to lift/shove/brace/hold; SOUTH/Omnipotent =
      advantage on saves vs frightened, charmed, paralysed or forced movement. Decline all four
      and you are *Unwelcome*: -1d4 on attacks, saves and checks, but ONLY in Doornian conflicts
      and against Doornian obstacles — NOT the gargoyle, the Dark Creeper, the scarab swarm, the
      settled ants, or the Black Water Cult. The choice is made ONCE and rides; 9m (Temple of
      the Sphynx) is the only place to convert, renounce or re-dedicate. Escalation widens scope, never the die — by the fifth room of
      refusal, Jiyloo's pendant no longer covers the holdout. Refusing buys something real:
      no Deception disadvantage in holy rooms, and in 9p the Keeper's hunger can speak only to
      an unsworn mind (thread:the-keeper). Session 5: everyone but Tath'Shar took the oath.
      THE FIVE RITES (taught in 9a, the vestibule): 1. Bear the sign. 2. Speak the praise.
      3. Arrive clean. 4. Depart holy. 5. Remain pure. Rites 1-2 are Rule one (the pendant and the
      spoken names); rite 3 is the foot-washing that settles the ants; rite 5 is the doorframe
      oath of Rule two plus conduct afterward (the party already broke it on the plinth); rite 4,
      "Depart holy," is what prices the loot — you leave as holy as you came, which in a building
      whose wealth IS its holiness means carrying none of it out.
      Rule three, READING THE DOORS: the tomb's primary function is not burial, it is holding
      the dead and the damned — Doorne does not destroy, he keeps. Four door-signs: clean
      pyramid (his), skull turned outward on the flank = SEALED (held forever), skull set into
      the face turned up to the apex = WASHING (being purified toward eventual release), road struck through = NO PASSAGE (9b); and an OPEN MOUTH carved beneath a clean
      pyramid = this threshold answers SPEECH, not a worn symbol (9e, 9m's threshold, and the
      secret door into 9p — which was never locked, and which the cult beat on for days with
      fire, steel, acid and a spell because nobody among them could read a mouth). The priests never entered the marked rooms; they
      were their keepers, left offerings at the threshold dishes, and the gold-flecked pilgrim
      road routes around every one. Marked rooms: 9d/9g/9h sealed, 9i/9k washing, 9b no passage,
      9f defaced (unreadable — An-Zefful likely erased his own sentence). Marks label ROOMS not
      objects, so 9l/9j/9n are unmarked and still dangerous. **9p has NO mark outside although it
      holds a wight** — its mark is on the INSIDE lintel, a skull recut over and over: the
      Keeper sealed himself in (thread:the-keeper).
    design: >
      The tomb as written is a room-by-room monster crawl with no information, no pressure,
      nobody to talk to and a poisoned reward. Review and six proposed depth concepts are in
      scenarios/ashes-at-the-sphinx-depth-concepts.md. Nothing there requires retconning what
      was already played.
    autonomous:
      - "The tomb does not care. Its guardians are ancient and faction-blind and will kill Black Water cultists exactly as readily as the party."
      - "Ashiq and the main body arrive on their own schedule whether the party is ready, deep inside, or already gone."

  - id: thread:the-keeper
    title: "The Keeper — the priest who stayed"
    status: dormant     # goes active when the party reaches 9o/9p (session 6)
    ref: "[[subloc:sphinx-sia]]"
    summary: >
      The wight in 9p is NOT Sia (Steve, after session 5). It is KAMENHET, Sia's high priest.
      When the empire fell and the priests stopped coming, he took the Scepter of Ice (the
      keeping-tool the tomb's guardians answer to) and made himself undead so the keeping would
      never end and the oasis would stay safe for the king's temples and travellers. Becoming a
      wight put a terrible evil in him — the hunger — so he sealed himself into the inner tomb with
      an oath on Doorne's names, behind a door that only opens to praise from outside. Sia lies
      dead and at rest in the sarcophagus; the Keeper keeps vigil in the chair at his feet. 9p is
      unmarked from outside; its INNER lintel carries a skull recut over and over between sealed
      and washing. He is rational and reasonable, but a wight: dangerous and unstable. The Ember
      going out two weeks ago has loosened his hold. He is the one still filing thieves (9g, the
      petrified cultist).
    protocol: >
      Confides only in priests (Gereon, Acolyte, is the honest answer; a false priest faces
      Insight +3). Answers the four oath-takers as pilgrims. Will not address Tath'Shar (unsworn,
      and killed on his threshold) — but the HUNGER speaks privately to the unsworn mind, and only
      to it: one truth (Tath'Shar's sister will come for the Scepter, a prohibited artifact) and one
      lie (leave the door open and it's yours). Jiyloo knows him from her grandmother's story, "the
      priest who stayed," kneels, and cannot speak to him.
    hunger_track: >
      0-6, starts at 3 (2 if the Ember is relit first). Rises on: someone within reach, blood, a
      drawn weapon, touching the Scepter/Coal/sarcophagus, a caught lie, the door left open. Falls
      on: his name spoken (-2 first time), a prayer in one of the four names, the door closed behind
      them, his feet washed. 0-2 the priest; 3-4 cracks (bargains here are partly the hunger's);
      5 he warns them to go; 6 he attacks — names spoken mid-fight can stop him, a blow after
      restarts it. He cannot cross his own threshold.
    the_offer: >
      "Keep my oath where I can't." (1) Relight the Ember with his Coal. (2) Bring back the oasis's
      people (the slaves; the dog has the El-Alouph scent). (3) End the drowning of the dead at its
      source: the Temple of Mennuj at AYATORRAH, 22 miles north on an old stone road — the source's
      own sequel, Forsaken Pyramid (ONA-16), where the cult's mystics bottle water spirits. It was
      his order's seat; he can teach the entry rite that disarms its gates for the faithful. A desert
      adventure on a dead priest's vow, not Elmingwed's interest. A living Doornian priest found
      there could take up the keeping at Temple al Sia — the only way the Keeper can be released
      without the keeping ending.
    reward: >
      (Steve, after session 5.) He promises ANCIENT LANGUAGE: a Bokkaran language engine stands
      behind his chair in 9p. For the right service he will have the priests, WHEN THEY RETURN to
      Sia, let the party use it. It is carried out in procession and set up in the great hall (9c)
      with a ceremony. Touching it deals d100 flat damage; a roll of double the character's HP or
      more is permanent death (the 5e massive-damage rule from full health). Survivors read and
      speak Bokkaran. Lethal at low level by design, so the reward pulls the party back later. A
      second engine waits with Yormon on the Sea of Souls (Bridged City arc); there are more.
      SPIDER BRACELETS halve engine damage — one wearer per bracelet per engine (tradeable, but
      each bracelet is used once at each engine). With the party's one bracelet, death needs a
      d100 roll of 4x HP; no roll can kill a 26+ HP wearer.
    autonomous:
      - "He does not move. He has waited four hundred years. But the hunger grows while the Ember stays out."
      - "If the party leaves 9p shut and the cult arrives with the drowned priest, the door opens for it — and the Keeper only talks to priests."

  - id: thread:jeffrol-hothme
    title: "Jeffrol on the northern road"
    status: dormant
    ref: "[[npc:jeff-giltor]]"
    summary: >
