# state.yaml — live state of the CURRENT (game-2, new-players) run.
#
# Seeded at the game-1 START state (see dnd/CLAUDE.md principle 1: the world is
# reset pre-trigger — cult at full strength, demon UNSUMMONED, sites unlooted,
# prior PCs absent). Prior-run history in world/ is reference only.
#
# Update this after each session (see methodology step 7).

campaign: "Deserts of Ajiibwan"
run: "game-2"          # the reset playthrough with new players
status: >
  in-play — 5 sessions played (campaign/sessions/01-05.md). Session 5 was a full crawl of the
  Tomb of the Sphinx: the party learned the door grammar, left the marked cells shut, slammed
  9f shut on An-Zefful, and ended at the hidden door into 9o (the false treasure room), one
  room short of Sia's tomb (9p). Jeffrol is resolved and gone (north road, ~9 weeks out). The
  Kantaroz tower is still unentered and its summoning still ticks. Elmingwed's letter to
  Tsendur is carried but UNDELIVERED. Expected next after the tomb: Tel A'bib (a short stop,
  not the six-week gap; deliver the captive monk to Elmingwed), then Durgan's Rest — the party
  promised Tath'Shar. Plan: arrive, sleep one night, stop; Phoenix is back for the letter and
  the raid. scenarios/mishap-at-durgans-rest.md -> "Coming here from Sia".

# --- Party ------------------------------------------------------------------
# Active table: 5 PCs at level 2 (CONFIRM: may have leveled to 3 in the session-5 crawl),
# plus Jiyloo (NPC) and Orkideh's dog. Six bodies and a
# dog in the field — meaningfully more capable than the "4 level-1 PCs" assumption baked
# into the world compendium's Oasis of Sia entry. Jeffrol is no longer with the party.
party:
  level: 2          # CONFIRM after session 5
  size: 5
  doorframe_oaths: >
    Session 5: everyone EXCEPT Tath'Shar took the 9a doorframe oath. Tath'Shar is Unwelcome
    (-1d4 vs Doorne's own work only). Which door each of the four chose (sets their boon):
    unrecorded and not needed — boons end when they leave the tomb. In 9p the Keeper answers the sworn as pilgrims, confides in priests
    (Gereon), and will not address Tath'Shar — but his hunger speaks only to them.
  members:
    - name: "Ren"        # player: Toan
      pronouns: "she/her"
      race: "Halfling"
      notes: "Spotted a construct in the foothills below Kantaron — the hook that led there."
    - name: "Orkideh"    # player: Steph (new player; likes to drive the story)
      pronouns: "she/her"
      race: "Elf"
      age: "~700"
      notes: >
        Former criminal partner of Jeffrol Giltor. Cut a deal with Elmingwed to hand Jeff
        over for half the proceeds of his loot; the proceeds turned out not to exist. Carries
        a hidden, unprovable secret — see thread:orkideh-secret (ACTIVE; Jeff told his side in
        session 3). Jeff is now 9 weeks up the northern road, which loosens but does not cut
        the leash — he comes back. Session 4: befriended and now keeps the oasis dog (below).
    - name: "Lia"        # player: Ania
      pronouns: "she/her"
      race: "Tiefling"
    - name: "Gereon"     # player: Mia
      pronouns: "he/him"
      race: "Dwarf"
      class: "Monk (Acolyte background — served in a temple; the party's natural 'priest' when Sia asks for one)"
      notes: >
        Scraggly dark brown-grey beard; plain (not fancy) robes, dressed too warm for the
        desert. Fast on foot — ran down the fleeing cult monk at the sphinx in session 4.
        Healed the oasis dog, which sealed its loyalty to Orkideh.
    - name: "Tath'Shar"  # player: Phoenix — debuted session 4 (2026-09-06)
      pronouns: "they/them"
      race: "Drow"
      notes: >
        Trans, gender-neutral — **they/them ONLY, never she/her.** (Their sister Maghiel is
        she/her.) Rogue from a rich family; subtly rich clothing — glamoured studded leather
        that reads as ordinary fine travel wear (DC Investigation to notice, and only after
        watching them through a long rest). Casts Thaumaturgy in place of the usual drow
        Dancing Lights. Carries Elmingwed's sealed letter for Tsendur at Durgan's Rest,
        still undelivered (thread:tsendur-letter). Has named [[npc:maghiel]] as their sister
        at the table and knows she is active in the region. Session 4: personally executed a
        bound cult prisoner on the sphinx's plinth, willingly.
        GM-ONLY: in this reset timeline Maghiel is NOT yet Black-Thorn-cursed — see
        scenarios/mishap-at-durgans-rest.md for the origin event this is building toward.
    - name: "Timiki"     # player: Briar — one-off guest in session 3
      bench: true
      notes: "Guest appearance session 3 (caught the fleeing Jeff). Did not attend session 4."

# Permanent / recurring NPCs traveling with the party
companions:
  - name: "Jiyloo Ubbett"
    ref: "[[pc:jiyloo]]"
    sheet: "level 1 Barbarian"
    role: "Guide & front-line muscle, originally hired by Elmingwed to take the party to Kantaron; still with them."
    disposition: >
      Decent. Dorne-faithful (see [[deity:doorne]]) — she has a real personal stake in the
      Oasis of Sia and will push back hard, in character, against stripping the temple or
      the tomb.
    gear: >
      **Doornian pyramid pendant**, worn under her robes. Session 4: she led down the sphinx
      stair, saw 9a, drew it out, wore it openly and announced "This area is holy for believers
      of Doorne." That is why the Caryatid Columns never attacked — the tomb's two credential-
      checking guardians are satisfied by an openly displayed pyramid (9a) or by spoken praise
      (9e). She said it in front of the whole party, so the fact is theirs; whether they have
      drawn the conclusion is another matter.
    operable: >
      The pendant must be VISIBLE and near the front to do anything. If Jiyloo is downed,
      rear-ranked, separated, or sent back up the stair, 9a stops being safe ground. It covers
      exactly two rooms of sixteen (9a, 9e) — not the undead, not the beasts, not the traps, and
      not An-Zefful, whom Doorne cursed rather than commissioned. Full coverage table and the
      "why the cult had to retreat and we walked in" answer:
      scenarios/ashes-at-the-sphinx.md -> "Doorne's rules at the table". Note also that ANYONE can wear a
      pyramid — Temple al Sia above ground is covered in them and the party has never been
      inside it. Jiyloo also gates the per-character BLESSING ("kneel in the doorframe and say
      'I take the goodness of Doorne into my heart'"); PCs who decline take the *Unwelcome*
      penalty in Doornian rooms. Same write-up.
  - name: "The oasis dog"
    ref: "area 4 mastiff, scenarios/ashes-at-the-sphinx.md"
    owner: "Orkideh"
    acquired: "Session 4 — freed from under a collapsed tent, calmed by Animal Handling + Speak with Animals, healed by Gereon."
    role: >
      Permanent companion. Standing: passive Perception (scent) for the party. Potential,
      with training: active Perception (scent) checks. Orkideh can also spend a Speak with
      Animals to brief it and hear back what it smells.
    open: >
      It is the EL-ALOUPH family's dog (area 4, the wagon/camel shop). That family surrendered
      and was TAKEN AS SLAVES into the desert — so per the source the dog "will follow the party,
      or lead them on the trail to its family," which makes it a live lead on the slave caravan
      (thread:missing-caravans). Separately, Afara Al-Doorne and her daughter Dasara are alive in
      a covered hole near the pond (Elven Goods, area 5; Abd killed getting them hidden) and have
      not been found. Two different households — do not merge them.

# Captives / departed
departed:
  - name: "Jeffrol Giltor"
    ref: "[[npc:jeff-giltor]]"
    status: >
      RESOLVED, session 4. Not handed over and not killed — Elmingwed put him to work.
      He is on the northern trade road toward the Granite Empire, personally shepherding
      the camel venture his stolen operating money is riding on, so Elmingwed's share pays
      out. Due back in ~9 weeks.
    gm_subplot: >
      On that road he ingratiates himself with the m'Thorsz at [[loc:hothme]] and sets up as
      a trading partner — and eventually a thorn/irritant — resurfacing as a rival operator
      if the party reaches Hothme and the western edge of the Vanic Imperial desert.
      See thread:jeffrol-hothme. Not yet in play.

# --- Where & when -----------------------------------------------------------
location:
  region: "[[region:deep-desert-oases]]"
  site: "[[loc:oasis-of-sia]] — inside [[subloc:sphinx-sia]], the Tomb of the Sphinx"
  precise: >
    At the hidden door between the two armoured statues (the "superbly hidden" 9c secret
    door), which opens into 9o, the False Treasure Room. 9o's floor is already collapsed
    onto spikes except a two-foot ledge before the door to 9p, Sia's tomb. Session-6 prep:
    scenarios/ashes-at-the-sphinx.md -> "Session 6 opens here" (the grammar as a search aid,
    five options for 9o, the Keeper in 9p, and the road north to Ayatorrah).
  situation: >
    Below: every room explored except 9o and 9p. The marked cells (9d, 9g, 9h, 9i, 9k) were
    left shut; An-Zefful (9f) is alive behind a door the party slammed. Loot: only a black
    obsidian serpent ring, off the petrified cultist ("the new statue"). The 9c cult camp was
    walked through, not searched. Above ground,
    unchanged since session 4: one captive monk, Temple al Sia unentered with its Ember
    smothered and its murdered priest unburied, Afara and Dasara still undiscovered in their
    pit, and the El-Alouph family still on the slave road.

clock:
  in_world_day: 5          # APPROXIMATE — day 1 was Elmingwed's gate; add travel Tel A'bib -> Sia. Session 5's crawl took ~8 hours below (GM, confirmed).
  # Time dilation is handled NARRATIVELY between adventures, not with a factor: when the
  # party returns to Tel A'bib, ~6 weeks pass before the next adventure (game 1 used ~2).
  # That downtime gap is when autonomous threads (threads.yaml) tick.
  between_adventure_gap: "~6 weeks at Tel A'bib"
  active_countdowns:
    - name: "Black Water main body returns to the sphinx"
      due: "1-2 days from the session-4 interrogation. The party has been below ~8 hours: due, not overdue. GM picks: during 9o/9p, on the stair, or after the party leaves (then it hits the tomb with nobody there — see the packet's 'After the tomb')"
      note: >
        Replaces the source module's flat 24-hour patrol clock. The captured guards said the
        main body left ~a week ago to fetch MAGICAL ITEMS NEEDED TO PENETRATE THE TOMB —
        i.e. something down there stopped them cold and they are coming back able to open it.
        This is a much better clock than the source's and it is the party's information,
        earned by interrogation, not GM fiat. Session-6 refinement (optional): the "magical
        items" are bottled water spirits (Essence of Hayawiyya) from the Temple of Mennuj at
        Ayatorrah, meant for the corpse of Temple al Sia's murdered priest, so a Doornian mouth
        can say the four names the fanatics will not. See scenarios/ashes-at-the-sphinx.md ->
        "The clock".
    - name: "Jeffrol returns from the Granite Empire road"
      due: "~9 weeks"
    - name: "Kantaroz summoning"
      due: "no fixed date — ticks on every stretch of party inaction (thread:kantaron-summoning)"

milestones:
  - "Session 3: Jeffrol captured. Party leveled to 2."
  - "Session 4: Jeffrol resolved (deployed north, not handed over). Party chose reputation over gold and took Elmingwed's Oasis of Sia job unpaid. Tath'Shar joined. Tomb of the Sphinx entered."
  - "Session 5: Full crawl of the Tomb of the Sphinx with almost no fighting. Ants re-frozen by the foot-washing while Jiyloo held the door. All but Tath'Shar took the oath. Door grammar learned and used; marked cells left shut; 9f slammed on An-Zefful. Took the petrified cultist's obsidian ring. Party at the hidden door into 9o."

