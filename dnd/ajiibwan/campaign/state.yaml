# state.yaml — live state of the CURRENT (game-2, new-players) run.
#
# Seeded at the game-1 START state (see dnd/CLAUDE.md principle 1: the world is
# reset pre-trigger — cult at full strength, demon UNSUMMONED, sites unlooted,
# prior PCs absent). Prior-run history in world/ is reference only.
#
# Update this after each session (see methodology step 7).

campaign: "Deserts of Ajiibwan"
run: "game-2"          # the reset playthrough with new players
status: >
  in-play — 6 sessions played (campaign/sessions/01-06.md). Session 6 (2026-10-24): the party
  bargained with the Keeper under the sphinx, relit the temple Ember and saved the Oasis of Sia.
  The cult can't get in and has retreated to a desert pyramid as its eastern outpost. The Keeper
  asked Ren to investigate it and blessed her to find it; she can see a faint path north. At his
  request the party left the rescued cultist Tabbat alive in his inner tomb, with Jiyloo's food
  and water. Clearing the pyramid earns the language engine from Sia's priests. In Tel A'bib
  they handed the captive cult monk to Elmingwed (thread:the-turned-monk), took public credit
  with the merchants instead of a contractor's fee; Elmingwed threw a banquet and passed a
  collection plate. Jiyloo joined as a full party
  member (1/5 of the loot). Level 3 earned, taken at Tsendur's. On day 2 of the mountain trail to Durgan's Rest,
  before camp, a friendly kobold troupe with a junk wagon stopped them, and the game ended there.
  Elmingwed's letter to Tsendur is still UNDELIVERED. Plan for session 7: the kobold trade, the
  road, arrive at Durgan's Rest and sleep one night; Phoenix delivers the letter and the raid
  follows. scenarios/mishap-at-durgans-rest.md -> "Session 7 opens here". Jeffrol is resolved
  and gone (north road). The Kantaroz tower is still unentered and its summoning still ticks.

# --- Party ------------------------------------------------------------------
# Active table: 5 PCs at level 2, with level 3 earned but not yet taken,
# plus Jiyloo (now a full party member) and Orkideh's dog. Six bodies and a
# dog in the field. Jeffrol is no longer with the party.
party:
  level: 2          # sheets are still level 2
  level_earned: 3   # earned by end of session 6 (Steve). Not taken at the start of session 7 — level up when they reach Tsendur's, likely the night before the raid
  size: 5
  gold: 52          # gp, after the Tel A'bib banquet collection and selling old equipment (session 6)
  loot_split: "Jiyloo takes 1/5 of the party's loot as a full member (from session 6)."
  doorframe_oaths: >
    Session 5: everyone EXCEPT Tath'Shar took the 9a doorframe oath. The boons ended when they
    left the tomb. History only now; it matters again if they enter another Doornian site.
  members:
    - name: "Ren"        # player: Toan
      pronouns: "she/her"
      race: "Halfling"
      armor: "Studded leather (Elmingwed's gift, session 6)"
      notes: >
        Spotted a construct in the foothills below Kantaron — the hook that led there.
        Session 6: the Keeper asked her to investigate the Dornian pyramid in the desert that
        the Black Water Cult has taken as its eastern outpost, and gave her a BLESSING — a
        religious and magical charge to find it and try to protect it from the cult's corruption.
        The pyramid is due west of Tel A'bib and due north of Sia, in the deeper desert about 20
        miles from any working road. Clearing it earns the party the language engine from Sia's
        priests. She sees a faint, possibly magical path leading north from the Oasis of Sia. There are
        several routes to the pyramid, and the blessing makes them easier for her to find
        (thread:the-keeper).
    - name: "Orkideh"    # player: Steph (new player; likes to drive the story)
      pronouns: "she/her"
      race: "Elf"
      age: "~700"
      notes: >
        Former criminal partner of Jeffrol Giltor. Cut a deal with Elmingwed to hand Jeff
        over for half the proceeds of his loot; the proceeds turned out not to exist. Carries
        a hidden, unprovable secret — see thread:orkideh-secret (ACTIVE; Jeff told his side in
        session 3). Jeff is now 9 weeks up the northern road, which loosens but does not cut
        the leash — he comes back. Session 4: befriended and now keeps the oasis dog (below).
    - name: "Lia"        # player: Ania
      pronouns: "she/her"
      race: "Tiefling"
      armor: "Studded leather (Elmingwed's gift, session 6)"
    - name: "Gereon"     # player: Mia
      pronouns: "he/him"
      race: "Dwarf"
      class: "Monk (Acolyte background — served in a temple; the party's natural 'priest' when Sia asks for one)"
      notes: >
        Scraggly dark brown-grey beard; plain (not fancy) robes, dressed too warm for the
        desert. Fast on foot — ran down the fleeing cult monk at the sphinx in session 4.
        Healed the oasis dog, which sealed its loyalty to Orkideh.
    - name: "Tath'Shar"  # player: Phoenix — debuted session 4 (2026-09-06)
      pronouns: "they/them"
      race: "Drow"
      notes: >
        Trans, gender-neutral — **they/them ONLY, never she/her.** (Their sister Maghiel is
        she/her.) Rogue from a rich family; subtly rich clothing — glamoured studded leather
        that reads as ordinary fine travel wear (DC Investigation to notice, and only after
        watching them through a long rest). Casts Thaumaturgy in place of the usual drow
        Dancing Lights. Carries Elmingwed's sealed letter for Tsendur at Durgan's Rest,
        still undelivered (thread:tsendur-letter). Has named [[npc:maghiel]] as their sister
        at the table and knows she is active in the region. Session 4: personally executed a
        bound cult prisoner on the sphinx's plinth, willingly.
        Session 6: Phoenix absent; Steve ran Tath'Shar as an NPC with input from the players
        present. Tath'Shar did much of the talking with Elmingwed and the Tel A'bib merchants.
        The Keeper's hunger never made its private offer to them (it only works as the player's
        secret) — hold it for a dream on the road (thread:the-keeper).
        GM-ONLY: in this reset timeline Maghiel is NOT yet Black-Thorn-cursed — see
        scenarios/mishap-at-durgans-rest.md for the origin event this is building toward.
    - name: "Timiki"     # player: Briar — one-off guest in session 3
      bench: true
      notes: "Guest appearance session 3 (caught the fleeing Jeff). Did not attend session 4."

# Permanent / recurring NPCs traveling with the party
companions:
  - name: "Jiyloo Ubbett"
    ref: "[[pc:jiyloo]]"
    sheet: "level 1 Barbarian"
    role: >
      FULL PARTY MEMBER as of session 6 — the party hired her themselves in Tel A'bib for 1/5 of
      the party's loot. Originally Elmingwed's hired guide to take the party to Kantaron.
    disposition: >
      Decent, chaotic good. Dorne-faithful (see [[deity:doorne]]) — she has a real personal stake
      in the Oasis of Sia and will push back hard, in character, against stripping the temple or
      the tomb. Session 6 showed the other edge: when the Keeper asked for the rescued cultist
      Tabbat to be left in his inner tomb, she left him plenty of food and water "so he doesn't
      die quickly." Vengeance for the murders above and the desecration below.
    gear: >
      **Doornian pyramid pendant**, worn under her robes. Session 4: she led down the sphinx
      stair, saw 9a, drew it out, wore it openly and announced "This area is holy for believers
      of Doorne." That is why the Caryatid Columns never attacked — the tomb's two credential-
      checking guardians are satisfied by an openly displayed pyramid (9a) or by spoken praise
      (9e). She said it in front of the whole party, so the fact is theirs; whether they have
      drawn the conclusion is another matter.
    operable: >
      The pendant must be VISIBLE and near the front to do anything. If Jiyloo is downed,
      rear-ranked, separated, or sent back up the stair, 9a stops being safe ground. It covers
      exactly two rooms of sixteen (9a, 9e) — not the undead, not the beasts, not the traps, and
      not An-Zefful, whom Doorne cursed rather than commissioned. Full coverage table and the
      "why the cult had to retreat and we walked in" answer:
      scenarios/ashes-at-the-sphinx.md -> "Doorne's rules at the table". Note also that ANYONE can wear a
      pyramid — Temple al Sia above ground is covered in them and the party has never been
      inside it. Jiyloo also gates the per-character BLESSING ("kneel in the doorframe and say
      'I take the goodness of Doorne into my heart'"); PCs who decline take the *Unwelcome*
      penalty in Doornian rooms. Same write-up.
  - name: "The oasis dog"
    ref: "area 4 mastiff, scenarios/ashes-at-the-sphinx.md"
    owner: "Orkideh"
    acquired: "Session 4 — freed from under a collapsed tent, calmed by Animal Handling + Speak with Animals, healed by Gereon."
    role: >
      Permanent companion. Standing: passive Perception (scent) for the party. Potential,
      with training: active Perception (scent) checks. Orkideh can also spend a Speak with
      Animals to brief it and hear back what it smells.
    open: >
      It is the EL-ALOUPH family's dog (area 4, the wagon/camel shop). That family surrendered
      and was TAKEN AS SLAVES into the desert — so per the source the dog "will follow the party,
      or lead them on the trail to its family," which makes it a live lead on the slave caravan
      (thread:missing-caravans). Separately, Afara Al-Doorne and her daughter Dasara are alive in
      a covered hole near the pond (Elven Goods, area 5; Abd killed getting them hidden) and have
      not been found. Two different households — do not merge them.

# Captives / departed
departed:
  - name: "The captive Black Water monk (female, unnamed)"
    ref: "thread:the-turned-monk"
    status: >
      Leader of the sphinx guard, run down by Gereon in session 4. Handed to Elmingwed in Tel
      A'bib, session 6. Possible return as a de-programmed Elmingwed employee: hard cult turned
      hard merchant, still unstable.
  - name: "Tabbat"
    ref: "thread:the-keeper -> tabbat_in_the_inner_tomb"
    status: >
      Black Water cultist rescued from the 9o ledge, session 6, and then left alive in the
      Keeper's inner tomb (9p) at the Keeper's request, with Jiyloo's food and water.
  - name: "Jeffrol Giltor"
    ref: "[[npc:jeff-giltor]]"
    status: >
      RESOLVED, session 4. Not handed over and not killed — Elmingwed put him to work.
      He is on the northern trade road toward the Granite Empire, personally shepherding
      the camel venture his stolen operating money is riding on, so Elmingwed's share pays
      out. Due back in ~9 weeks.
    gm_subplot: >
      On that road he ingratiates himself with the m'Thorsz at [[loc:hothme]] and sets up as
      a trading partner — and eventually a thorn/irritant — resurfacing as a rival operator
      if the party reaches Hothme and the western edge of the Vanic Imperial desert.
      See thread:jeffrol-hothme. Not yet in play.

# --- Where & when -----------------------------------------------------------
location:
  region: "the mountains below [[loc:durgans-rest]]"
  site: "the mountain trail from Tel A'bib to Durgan's Rest (Roll20 hex 2012 is the destination)"
  precise: >
    Day 2 out of Tel A'bib, on the trail up into the mountains, late in the day and before
    camp. A friendly troupe of kobolds with a wagon of junk to trade has just surprised them.
    Session-7 prep: scenarios/mishap-at-durgans-rest.md -> "Session 7 opens here".
  situation: >
    Behind them: the Oasis of Sia is saved — the Ember relit, the tomb left intact, the
    western route reopening. The party is celebrated in Tel A'bib after Elmingwed's banquet.
    Still out there: the El-Alouph family and the other slaves on the desert road, Afara and
    Dasara (never found, as far as the record shows), Tabbat alive in the Keeper's inner tomb,
    and the Dornian pyramid the cult has made its eastern outpost, which Ren is charged to
    investigate. Ahead: Tsendur, the undelivered letter, and Maghiel.

clock:
  in_world_day: 12         # APPROXIMATE — ~day 5 in the tomb, a few days back to Tel A'bib, the banquet, then 2 days on the mountain trail. Adjust to the Roll20 tracker.
  # Time dilation is handled NARRATIVELY between adventures, not with a factor: when the
  # party returns to Tel A'bib, ~6 weeks pass before the next adventure (game 1 used ~2).
  # That downtime gap is when autonomous threads (threads.yaml) tick.
  between_adventure_gap: "~6 weeks at Tel A'bib"
  active_countdowns:
    - name: "Black Water main body returns to the sphinx"
      due: "PASSED (session 6). The Ember was relit; the cult can't get into Sia and has retreated to a desert pyramid as its eastern outpost (Steve)."
      note: >
        Replaces the source module's flat 24-hour patrol clock. The captured guards said the
        main body left ~a week ago to fetch MAGICAL ITEMS NEEDED TO PENETRATE THE TOMB —
        i.e. something down there stopped them cold and they are coming back able to open it.
        This is a much better clock than the source's and it is the party's information,
        earned by interrogation, not GM fiat. Session-6 refinement (optional): the "magical
        items" are bottled water spirits (Essence of Hayawiyya) from the Temple of Mennuj at
        Ayatorrah, meant for the corpse of Temple al Sia's murdered priest, so a Doornian mouth
        can say the four names the fanatics will not. See scenarios/ashes-at-the-sphinx.md ->
        "The clock".
    - name: "Jeffrol returns from the Granite Empire road"
      due: "~9 weeks"
    - name: "Kantaroz summoning"
      due: "no fixed date — ticks on every stretch of party inaction (thread:kantaron-summoning)"

canon:
  bokkaran_language: >
    (Steve, after session 6.) Bokkaran is a "Linear A" language. Nobody can read it whole, and
    nobody can TEACH it. Every small piece of progress took hard labour, and the scholars who made
    it guard it. The only real ways to learn Bokkaran are a grant from a spirit or god, or a
    Bokkaran language engine (the Keeper's at Sia is owed to the party if the pyramid is cleared of
    the Black Water Cult). Tsendur can say roughly what a Bokkaran spell is about, but even he can't
    cast one without long study, even from a scroll, let alone copy it to a spellbook.
  magical_consequences: >
    (Steve, after session 6.) Casting any Bokkaran spell triggers magical consequences: extra
    effects beyond the spell itself. Ways to avoid them exist (lore-and-mysteries.md names Bokkaran
    charms and an anti-miscast spell), but in game 2 NOBODY knows what they are yet, and scholars
    like Tsendur are nowhere close to finding out.

milestones:
  - "Session 3: Jeffrol captured. Party leveled to 2."
  - "Session 4: Jeffrol resolved (deployed north, not handed over). Party chose reputation over gold and took Elmingwed's Oasis of Sia job unpaid. Tath'Shar joined. Tomb of the Sphinx entered."
  - "Session 5: Full crawl of the Tomb of the Sphinx with almost no fighting. Ants re-frozen by the foot-washing while Jiyloo held the door. All but Tath'Shar took the oath. Door grammar learned and used; marked cells left shut; 9f slammed on An-Zefful. Took the petrified cultist's obsidian ring. Party at the hidden door into 9o."
  - "Session 6 (2026-10-24): Rescued the stranded cultist Tabbat and questioned him. Bargained with the Keeper; relit the temple Ember; the Oasis of Sia saved, and the cult retreated to a desert pyramid outpost. Ren took the Keeper's blessing to investigate that pyramid. Left Tabbat alive in the inner tomb at the Keeper's request. Tel A'bib: public credit instead of a fee, Elmingwed's banquet and the merchants' collection (52 gp after selling old gear), studded leather for Ren and Lia. Jiyloo joined as a full member (1/5 of loot). Level 3 earned. Met friendly kobold traders on day 2 of the mountain trail. Phoenix absent; Tath'Shar NPC'd."

